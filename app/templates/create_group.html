<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Создать группу</title>
  <script src="/static/js/validate.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .form-container {
      background: #fff;
      padding: 2rem;
      border-radius: 0.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }
    h1 {
      margin-top: 0;
      margin-bottom: 1.5rem;
      font-size: 1.75rem;
      text-align: center;
      color: #333;
    }
    .form-group {
      margin-bottom: 1rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }
    .form-group input[type="text"],
    .form-group select {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 0.25rem;
      font-size: 1rem;
    }
    .form-group input[type="checkbox"] {
      transform: scale(1.2);
      margin-right: 0.5rem;
      vertical-align: middle;
    }
    .btn-submit {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      color: #fff;
      background-color: #28a745;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
    }
    .btn-submit:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h1>Создать группу</h1>
    <form id="create-group-form">
      <div class="form-group">
        <label for="tg_id">ID группы в Telegram</label>
        <input type="text" id="tg_id" name="tg_id" required />
      </div>
      <div class="form-group">
        <label for="name">Имя группы</label>
        <input type="text" id="name" name="name" required />
      </div>
      <div class="form-group">
        <label>
          <input type="checkbox" id="notification" name="notification" />
          Уведомление
        </label>
      </div>
      <div class="form-group">
        <label for="study_form">Форма обучения</label>
        <select id="study_form" name="study_form" required>
          <option value="ochnaya">Очная</option>
          <option value="och_zaoch">Очно-заочная</option>
        </select>
      </div>
      <div class="form-group">
        <label for="course">Курс</label>
        <select id="course" name="course" required>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
        </select>
      </div>
      <button type="submit" class="btn-submit">Создать</button>
    </form>
  </div>

  <script>
    document.getElementById('create-group-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = e.target;

      const data = {
        chat_id: form.tg_id.value.trim(),
        name_group: form.name.value.trim(),
        is_notify: form.notification.checked,
        forma_obychenia: form.study_form.value,
        kyrs: parseInt(form.course.value, 10)
      };

      try {
        const token = localStorage.getItem('jwt');
        const res = await fetch("/group/create/", {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify(data)
        });

        if (res.ok) {
          window.location.href = "/admin/";
          return;
        }

        const errObj = await res.json();
        console.error('Server error:', errObj);

        // Составляем понятное сообщение
        let message = '';
        if (errObj.detail) {
          if (typeof errObj.detail === 'string') {
            message = errObj.detail;
          } else if (Array.isArray(errObj.detail)) {
            message = errObj.detail.map(item => item.msg || JSON.stringify(item)).join('\n');
          } else {
            message = JSON.stringify(errObj.detail);
          }
        } else {
          message = 'Ошибка при создании группы';
        }

        alert(message);
      } catch (err) {
        console.error('Network error:', err);
        alert('Ошибка сети, попробуйте позже');
      }
    });
  </script>
</body>
</html>
