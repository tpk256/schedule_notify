
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <script src="/static/js/validate.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Список групп</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f8f9fa;
      padding: 2rem;
      margin: 0;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 1.5rem;
    }
    table {
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 0.75rem;
      border: 1px solid #dee2e6;
      text-align: left;
      vertical-align: middle;
    }
    th {
      background-color: #007BFF;
      color: #fff;
      font-weight: normal;
    }
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    .status-on {
      color: #28a745;
      font-weight: bold;
    }
    .status-off {
      color: #dc3545;
      font-weight: bold;
    }
    .code-field {
      margin-top: 0.5rem;
      font-family: monospace;
      background: #e9ecef;
      padding: 0.25rem 0.5rem;
      border-radius: 0.25rem;
      display: inline-block;
    }
  </style>
</head>
<body>
  <h1>Список групп</h1>
  <table>
    <thead>
      <tr>
        <th>Имя группы</th>
        <th>ID группы TG</th>
        <th>Статус оповещений</th>
        <th>Код</th>
      </tr>
    </thead>
    <tbody>
      {% for group in groups %}
      <tr>
        <td>{{ group.name_group }}</td>
        <td>{{ group.chat_id }}</td>
        <td>
          {% if group.is_notify %}
            <span class="status-on">Включено</span>
          {% else %}
            <span class="status-off">Выключено</span>
          {% endif %}
        </td>
        <td>

            {% if group.activated %}
              <div class="status-on">Активирован</div>
            {% else %}
              <div class="status-off">Неактивирован</div>
            {% endif %}
            <div class="code-field">{{ group.code }}</div>


        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
