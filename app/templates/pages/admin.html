
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="/static/js/validate.js"></script>
  <title>Управление группами</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      background-color: #f8f9fa;
    }
    h1 {
      margin-bottom: 2rem;
      font-size: 2rem;
      color: #333;
    }
    .btn-container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .btn {
      display: inline-block;
      margin: 0.5rem 0;
      padding: 0.75rem 1.5rem;
      font-size: 1rem;
      color: #fff;
      background-color: #007BFF;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      min-width: 200px;
    }
    .btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <h1>Управление группами</h1>
  <div class="btn-container">
    <a class="btn" href="{{ url_for('form_create_group') }}">Создать группу</a>
    <a class="btn" href="{{ url_for('admin_groups') }}">Список групп</a>
    <a class="btn" href="{{ url_for('admin_message') }}">Создать сообщение</a>
  </div>
</body>
</html>
