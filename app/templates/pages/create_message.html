<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="/static/js/validate.js"></script>
  <title>Создать сообщение</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .container {
      background-color: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      max-width: 500px;
      width: 100%;
    }
    h1 {
      margin-top: 0;
      font-size: 1.5rem;
      text-align: center;
      color: #333;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #555;
    }
    textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      resize: vertical;
      font-size: 1rem;
      margin-bottom: 16px;
    }
    .back-btn {
            background-color: #f4f4f9;
            color: #555;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
        }
    .checkbox-group {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
    }
    .checkbox-group input[type="checkbox"] {
      margin-right: 8px;
      transform: scale(1.2);
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
    }
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <a href="{{ url_for('admin') }}" class="back-btn">← Назад</a>
  <div class="container">
    <h1>Создать сообщение</h1>
    <form id="message-form">
      <div>
        <label for="text">Текст сообщения:</label>
        <textarea id="text" name="text" rows="4" required></textarea>
      </div>
      <div class="checkbox-group">
        <input type="checkbox" id="send_immediately" name="send_immediately">
        <label for="send_immediately">отправить сразу</label>
      </div>
      <button type="submit">Создать</button>
    </form>
  </div>

  <script>
    document.getElementById('message-form').addEventListener('submit', async function(e) {
      e.preventDefault();

      const token = localStorage.getItem('jwt');
      if (!token) {
        alert('Токен не найден в localStorage');
        return;
      }

      const payload = {
        text: document.getElementById('text').value,
        is_send: document.getElementById('send_immediately').checked
      };

      try {
        const response = await fetch("{{ url_for('create_message') }}", {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          const result = await response.json();
          alert('Сообщение успешно создано');
          document.getElementById('message-form').reset();
        } else {
          const errorText = await response.text();
          alert('Ошибка при создании сообщения: ' + errorText);
        }
      } catch (err) {
        console.error(err);
        alert('Сетевая ошибка при отправке сообщения');
      }
    });
  </script>
</body>
</html>
